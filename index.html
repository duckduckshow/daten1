<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Statistik · Drei Levels</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#183b3a;background:#f3f6f4;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:44px auto;padding:0 22px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}h1{font-size:32px;letter-spacing:-1px;margin:0}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#667c75;margin:0 0 7px}.badge{border:1px solid #d5dfd9;padding:7px 12px;border-radius:30px;color:#61766f;font-size:12px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}button{font:inherit;cursor:pointer}nav button{padding:15px 12px;border:1px solid #d3dfd9;border-radius:13px;background:transparent;text-align:left;color:#526a63}nav b{display:block;font-size:16px;margin-bottom:3px}nav span{font-size:12px}nav button[aria-selected=true]{background:#184e45;color:white;border-color:#184e45}.card{background:white;border:1px solid #dce5df;border-radius:20px;padding:30px;box-shadow:0 10px 40px #123c2b06}.meta{font-size:12px;color:#6a7f77;display:flex;justify-content:space-between;gap:10px}h2{font-size:23px;line-height:1.35;margin:23px 0 20px;letter-spacing:-.4px}.listrow{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:20px}.listrow .data{flex:1;margin-bottom:0}.sort{white-space:nowrap;padding:11px 14px;border:1px solid #cbdad1;border-radius:9px;background:#f8faf8;color:#285346;font-size:13px}.sort:disabled{opacity:.6;cursor:default}.data{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}.num{background:#eff4f1;border-radius:9px;padding:9px 13px;font-size:20px;font-variant-numeric:tabular-nums}.extra{background:#fff0dc;color:#8f5010}.summary{font-size:15px;line-height:1.8;margin:12px 0 20px;color:#45645a}.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}.answer{display:flex;gap:12px;align-items:center;padding:17px 15px;min-height:65px;background:#fff;border:1.5px solid #d9e2dc;border-radius:12px;text-align:left;color:#234b40;font-size:17px}.answer .letter{font-size:12px;border:1px solid #d7e2db;border-radius:6px;min-width:24px;height:24px;display:grid;place-items:center}.answer[aria-pressed=true]{border-color:#245f50;background:#edf5f0}.answer:disabled{cursor:default;opacity:1}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:15px}.primary{background:#184e45;color:white;border:0;border-radius:10px;padding:13px 25px;font-weight:650;min-width:120px}.primary:disabled{opacity:.35;cursor:default}#feedback{font-size:20px;font-weight:700;min-height:29px}.right{color:#197046}.wrong{color:#ad3939}button:focus-visible{outline:3px solid #e0ac54;outline-offset:4px}footer{font-size:12px;color:#7a8a83;text-align:center;margin:22px} @media(max-width:560px){main{margin:24px auto;padding:0 14px}.badge{display:none}.card{padding:23px 19px}nav{gap:6px}nav button{padding:12px 10px}nav span{font-size:11px}.answers{grid-template-columns:1fr}h2{font-size:21px}.answer{min-height:58px;padding:13px}h1{font-size:29px}.num{font-size:18px;padding:8px 11px}}</style>
<main><header><div><p class="eyebrow">Mathematik · Üben</p><h1>Statistik</h1></div><span class="badge">Taschenrechner erlaubt</span></header>
<nav aria-label="Level wählen" role="tablist"><button role="tab" data-level="1"><b>Level 1</b><span>Werte bestimmen</span></button><button role="tab" data-level="2"><b>Level 2</b><span>Ein Wert kommt dazu</span></button><button role="tab" data-level="3"><b>Level 3</b><span>Den Wert finden</span></button></nav>
<section class="card" aria-labelledby="question"><div class="meta"><span id="levelname"></span><span id="counter"></span></div><h2 id="question"></h2><div id="context"></div><div class="answers" id="answers" aria-label="Antworten"></div><div class="actions"><div id="feedback" role="status" aria-live="polite"></div><button class="primary" id="action" disabled>Prüfen</button></div></section><footer>Ohne Anmeldung · funktioniert offline</footer></main>
<script>
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const sum=a=>a.reduce((s,x)=>s+x,0),mean=a=>sum(a)/a.length;
const median=a=>{a=[...a].sort((x,y)=>x-y);let m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2};
const mode=a=>{let counts=new Map();a.forEach(v=>counts.set(v,(counts.get(v)||0)+1));let max=Math.max(...counts.values()),w=[...counts].filter(([v,c])=>c===max);return w.length===1?w[0][0]:null};
const fmt=n=>typeof n==='number'?String(Math.round(n*10)/10).replace('.',','):String(n);
const tenth=x=>Math.abs(x*10-Math.round(x*10))<1e-8;
function list(integerMean=false){for(;;){let n=rand(5,9),a=Array.from({length:n},()=>rand(1,24));if((integerMean?Number.isInteger(mean(a)):tenth(mean(a)))&&mode(a)!==null)return shuffle(a)}}
function choices(correct,alts){let a=[correct,...alts.filter(v=>v!==correct)];a=[...new Set(a)];for(let d=1;a.length<4;d++)if(!a.includes(correct+d))a.push(correct+d);return shuffle(a.slice(0,4))}
function modalAnswer(a){let c=new Map();a.forEach(x=>c.set(x,(c.get(x)||0)+1));let max=Math.max(...c.values());if(max===1)return 'Kein Wert kommt häufiger vor';let winners=[...c].filter(x=>x[1]===max);return winners.length>1?'Mehrere Werte sind am häufigsten':winners[0][0]}
function makeTask(level,index){if(level===1){let kind=index%3,a=list(),correct,options;
if(kind===0){let variant=Math.floor(index/3)%4;if(variant===1){let pool=shuffle(Array.from({length:24},(_,i)=>i+1));a=pool.slice(0,rand(5,8))}if(variant===2){let pool=shuffle(Array.from({length:24},(_,i)=>i+1));a=shuffle([pool[0],pool[0],pool[1],pool[1],pool[2],pool[3]])}correct=modalAnswer(a);options=shuffle([...new Set([correct,'Kein Wert kommt häufiger vor','Mehrere Werte sind am häufigsten',...[...new Set(a)].filter(x=>x!==correct)])].slice(0,4))}
else{correct=kind===1?median(a):mean(a);options=choices(correct,[mode(a),median(a),mean(a),Math.min(...a),Math.max(...a),correct+1])}
return{a,correct,options,kind,title:`Bestimme den ${['Modalwert','Zentralwert (Median)','Mittelwert'][kind]}.`}}
if(level===2){let metric=Math.floor(index/6)%2,qualitative=index%6<3,direction=index%3,a,extra,b,old,now,candidates;
for(;;){a=list(true);old=metric===0?median(a):mean(a);candidates=[];for(let x=0;x<=80;x++){let v=metric===0?median([...a,x]):mean([...a,x]);let dir=v<old?0:v>old?2:1;if(dir===direction&&tenth(v))candidates.push(x)}if(candidates.length){extra=candidates[rand(0,candidates.length-1)];b=[...a,extra];now=metric===0?median(b):mean(b);break}}
let name=metric===0?'Zentralwert':'Mittelwert',correct=qualitative?['sinkt','bleibt gleich','steigt'][direction]:now,options=qualitative?shuffle(['sinkt','bleibt gleich','steigt']):choices(now,[old,now+1,now-1,now+2].filter(x=>x>=0));return{a,extra,old,now,metric,correct,options,title:qualitative?`Wie verändert sich der ${name}?`:`Wie groß ist der ${name} danach?`}}
let direction=index%3,n,before,after,extra;
if(index<6){n=index<3?2:3;before=[5,10][rand(0,1)];after=direction===0?before-1:direction===1?before:before+1;extra=(n+1)*after-n*before}
else if(index<12){n=rand(3,4);before=rand(1,3)*5;after=direction===0?before-1:direction===1?before:before+1;extra=(n+1)*after-n*before}
else{for(;;){n=rand(3,9);before=rand(5,22);after=direction===0?before-rand(1,3):direction===1?before:before+rand(1,6);extra=Math.round(((n+1)*after-n*before)*10)/10;if(extra>=0)break}}
return{n,before,after,correct:extra,options:choices(extra,[after-before,after,before,extra+n,extra-n].filter(x=>x>=0)),title:'Welcher Wert ist dazugekommen?'}}
let level=1,index=0,task,selected=null,checked=false;let counts=[0,0,0],scores=[0,0,0];
const el=id=>document.getElementById(id);
function render(){task=makeTask(level,index);selected=null;checked=false;document.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-selected',String(+b.dataset.level===level)));el('levelname').textContent=`LEVEL ${level}`;el('counter').textContent=`Aufgabe ${index+1} · ${scores[level-1]} / ${counts[level-1]} richtig`;el('question').textContent=task.title;el('context').replaceChildren();
if(task.a){let row=document.createElement('div');row.className='listrow';let box=document.createElement('div');box.className='data';const paint=values=>{box.replaceChildren();values.forEach(x=>{let s=document.createElement('span');s.className='num';s.textContent=fmt(x);box.append(s)})};paint(task.a);let sort=document.createElement('button');sort.className='sort';sort.textContent='Liste ordnen';sort.onclick=()=>{paint([...task.a].sort((a,b)=>a-b));sort.disabled=true};row.append(box,sort);el('context').append(row)}
if(level===2){let p=document.createElement('p');p.className='summary';p.innerHTML=`Vorher: ${task.metric===0?'Zentralwert':'Mittelwert'} <b>${fmt(task.old)}</b><br>Zusätzlicher Wert: <span class="num extra">${fmt(task.extra)}</span>`;el('context').append(p)}
if(level===3){let p=document.createElement('p');p.className='summary';p.innerHTML=`Vorher: <b>${task.n} Werte</b> · Mittelwert <b>${task.before}</b><br>Danach: <b>${task.n+1} Werte</b> · Mittelwert <b>${task.after}</b>`;el('context').append(p)}
el('answers').replaceChildren();task.options.forEach((v,i)=>{let b=document.createElement('button');b.className='answer';b.setAttribute('aria-pressed','false');let label=task.pair?`Zentralwert ${fmt(+v.split('|')[0])} · Mittelwert ${fmt(+v.split('|')[1])}`:fmt(v);b.innerHTML=`<span class="letter">${'ABCD'[i]}</span><span>${label}</span>`;b.onclick=()=>{if(checked)return;selected=v;el('answers').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));el('action').disabled=false};el('answers').append(b)});el('feedback').textContent='';el('feedback').className='';el('action').textContent='Prüfen';el('action').disabled=true}
el('action').onclick=()=>{if(checked){index++;render();return}if(selected===null)return;checked=true;let right=selected===task.correct;counts[level-1]++;if(right)scores[level-1]++;el('feedback').textContent=right?'Richtig':'Falsch';el('feedback').className=right?'right':'wrong';el('answers').querySelectorAll('button').forEach(b=>b.disabled=true);el('counter').textContent=`Aufgabe ${index+1} · ${scores[level-1]} / ${counts[level-1]} richtig`;el('action').textContent='Weiter →'};
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=+b.dataset.level;index=0;render()});render();
</script></html>
